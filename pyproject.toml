[project]
name = "challenge"
version = "0.1.0"
description = "Reproducible Marketing Mix Model challenge"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.0",
    "numpy>=2.5.3",
    "optuna>=4.5.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
